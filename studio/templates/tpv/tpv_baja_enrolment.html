{% load i18n %}

{% for e in enrolment_list %}
	<form method='post' action='{% url "baja_enrolment" %}' class="form-horizontal" id="baja_enrolment"> 
		{% csrf_token %}
		<div class="modal fade" tabindex="-1" role="dialog" id="bajaModal_{{e.id}}">
			<div class="modal-dialog" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
						<h4 class="modal-title">{% trans "Baja de matrícula" %} </h4>
					</div>
					<div class="modal-body">
						<input type="hidden" name="enrolment" value="{{e.id}}" />				
						{% trans "Esta seguro de que desea dar de baja la matrícula: " %} <strong>{{e}}</strong>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
						<input type="submit" class="btn btn-primary" value="Dar de baja" />
					</div>
				</div><!-- /.modal-content -->
			</div><!-- /.modal-dialog -->
		</div><!-- /.modal -->
	</form>
{% endfor %}
