{% extends "base.html" %}

{% load static %}

{% block content %}

<div class="well">
	<div class="row">
		<div class="col-md-6">
			<div class="panel panel-default">
				<div class="panel-body text-center">
					<img src="{% static "images/logo.png" %}" alt="logo" class="img-rounded" width="100%"/>
				</div>
			</div>
		</div>
		<div class="col-md-6">
			<div class="panel panel-default">
				<div class="panel-body text-center">
					{% if form.errors %}
						<p>Your username and password didn't match. Please try again.</p>
					{% endif %}
			
					<form class="form-horizontal" method="post">
						{% csrf_token %}
						<input type="hidden" name="next" value="{% url 'index' %}" />
						<div class="form-group">
							<label class="col-sm-4 control-label">Nombre de usuario: </label>
							<div class="col-sm-6">
								<div class="form-group">
									<input placeholder="" class="form-control" type="text" name="username" id="id_username"/>
								</div>
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-4 control-label">Contraseña: </label>
							<div class="col-sm-6">
								<div class="form-group">
									<input placeholder="" class="form-control" type="password" name="password" id="id_password"/>
								</div>
							</div>
						</div>
						<div class="form-group">
							<div class="col-sm-12">
								<div class="form-inline">
									<div class="form-group">
										<input value="Entrar" class="btn btn-primary" type="submit">
									</div>
								</div>
							</div>
						</div>
					</form>
				</div>
			</div>


			{% comment %}
			<form method="post" action="{% url "auth_login" %}" class="form-horizontal">
				{% csrf_token %}
				{{ form }}
				<input type="hidden" name="next" value="{{ next }}" />
				<div class="form-actions">
					<button type="submit" class="btn btn-primary">Submit</button>
				</div>
			</form>
			{% endcomment %}
		</div>
	</div>
</div>

{% endblock %}
