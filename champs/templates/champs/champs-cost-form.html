{% load i18n %}

<div class="row">
    <div class="col-xs-1 col-xs-offset-11">
        <button type="button" class="btn btn-sm btn-default" data-dismiss="modal" title="{% trans "Close" %}">
            <span class="glyphicon glyphicon-remove"></span>
        </button>
    </div>
</div>

<div class="panel panel-info">
    <div class="panel-heading">
        <strong>
            {% if champ_cost %}
                {% trans "Editar coste" %}
            {% else %}
                {% trans "Añadir coste" %}
            {% endif %}
        </strong>
    </div>
    <div class="panel-body">
        <p><strong>{{ champ.name }}</strong></p>

        <div class="form-group">
            <label for="champ-cost-scope">{% trans "Aplica a" %}</label>
            <select id="champ-cost-scope" class="form-control">
                <option value="all_travelers" {% if champ_cost.scope != "category" and champ_cost.scope != "companions" %}selected{% endif %}>{% trans "Todos los viajeros" %}</option>
                <option value="category" {% if champ_cost.scope == "category" %}selected{% endif %}>{% trans "Solo una categoría" %}</option>
                <option value="companions" {% if champ_cost.scope == "companions" %}selected{% endif %}>{% trans "Solo acompañantes" %}</option>
            </select>
        </div>

        <div id="champ-cost-category-group" class="form-group">
            <label for="champ-cost-category">{% trans "Categoría" %}</label>
            <select id="champ-cost-category" class="form-control">
                <option value="">{% trans "Selecciona una categoría" %}</option>
                {% for item in category_list %}
                    <option value="{{ item.id }}" {% if champ_cost.category.id == item.id %}selected{% endif %}>
                        {{ item.category.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="champ-cost-select">{% trans "Concepto existente" %}</label>
            <select id="champ-cost-select" class="form-control">
                <option value="">{% trans "Selecciona un concepto" %}</option>
                {% for cost in cost_list %}
                    <option value="{{ cost.id }}" {% if champ_cost.cost.id == cost.id %}selected{% endif %}>
                        {{ cost.name }}
                    </option>
                {% endfor %}
            </select>
            <span id="champ-cost-select__msg"></span>
        </div>

        <div class="form-group">
            <label for="champ-cost-name">{% trans "Nuevo concepto" %}</label>
            <input type="text"
                   id="champ-cost-name"
                   class="form-control"
                   value=""
                   placeholder="{% trans "Rellena este campo si quieres crear un concepto nuevo" %}">
            <span id="champ-cost-name__msg"></span>
        </div>

        <div class="form-group">
            <label for="champ-cost-amount">{% trans "Importe" %}</label>
            <input type="number"
                   step="0.01"
                   id="champ-cost-amount"
                   class="form-control champ-cost-required"
                   value="{{ champ_cost.amount|default:"0" }}"
                   required>
            <span id="champ-cost-amount__msg"></span>
        </div>

        <div class="form-group">
            <label for="champ-cost-amount-type">{% trans "Tipo de importe" %}</label>
            <select id="champ-cost-amount-type" class="form-control">
                <option value="per_competitor" {% if champ_cost.amount_type != "global" %}selected{% endif %}>{% trans "Por competidora" %}</option>
                <option value="global" {% if champ_cost.amount_type == "global" %}selected{% endif %}>{% trans "Global (se reparte entre las personas afectadas)" %}</option>
            </select>
        </div>
    </div>
    <div class="panel-footer">
        <div class="row">
            <div class="col-sm-6 text-center">
                <button type="button" class="btn btn-sm btn-danger" data-dismiss="modal">
                    {% trans "Cancelar" %}
                </button>
            </div>
            <div class="col-sm-6 text-center">
                <button type="button"
                        id="save-champ-cost-btn"
                        class="btn btn-sm btn-success ark-validate"
                        data-url="{% url "save-champ-cost" %}"
                        data-target="champ-detail-content"
                        data-modal="common-modal"
                        data-validate="champ-cost-required"
                        data-champ_id="{{ champ.id }}"
                        data-champ_cost_id="{{ champ_cost.id }}">
                    {% trans "Guardar" %}
                </button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $('#save-champ-cost-btn').on('click', function() {
        var costSelect = $('#champ-cost-select');
        var costName = $('#champ-cost-name');
        if (!costSelect.val() && !costName.val()) {
            costSelect.attr('required', 'required');
            costName.attr('required', 'required');
            costSelect.data('check', 'champ-cost-name');
            costName.data('check', 'champ-cost-select');
            costSelect.addClass('champ-cost-required');
            costName.addClass('champ-cost-required');
        } else {
            costSelect.removeAttr('required');
            costName.removeAttr('required');
            costSelect.removeData('check');
            costName.removeData('check');
            costSelect.removeClass('invalid');
            costName.removeClass('invalid');
            $('#champ-cost-select__msg').html('');
            $('#champ-cost-name__msg').html('');
        }
        $(this).data('cost_id', $('#champ-cost-select').val());
        $(this).data('cost_name', $('#champ-cost-name').val());
        $(this).data('scope', $('#champ-cost-scope').val());
        $(this).data('category_id', $('#champ-cost-scope').val() === 'category' ? $('#champ-cost-category').val() : '');
        $(this).data('amount', $('#champ-cost-amount').val());
        $(this).data('amount_type', $('#champ-cost-amount-type').val());
    });

    function updateChampCostScope() {
        var isCategoryScope = $('#champ-cost-scope').val() === 'category';
        $('#champ-cost-category-group').toggle(isCategoryScope);
        $('#champ-cost-category').prop('required', isCategoryScope).toggleClass('champ-cost-required', isCategoryScope);
    }
    $('#champ-cost-scope').on('change', updateChampCostScope);
    updateChampCostScope();
</script>
