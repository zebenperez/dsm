{% load i18n %}

<div class="panel panel-info">
    <div class="panel-heading">
        <strong>
            {% if champ_category %}{% trans "Editar categoría" %}{% else %}{% trans "Añadir categoría" %}{% endif %}
        </strong>
    </div>
    <div class="panel-body">
        <p><strong>{{ champ.name }}</strong></p>
        <div class="form-group">
            <label for="champ-category-name">{% trans "Nombre" %}</label>
            <input type="text"
                   id="champ-category-name"
                   class="form-control"
                   value="{{ champ_category.category.name }}"
                   required>
        </div>
    </div>
    <div class="panel-footer">
        <div class="row">
            <div class="col-sm-6 text-center">
                <button type="button" class="btn btn-sm btn-danger" data-dismiss="modal">{% trans "Cancelar" %}</button>
            </div>
            <div class="col-sm-6 text-center">
                <button type="button"
                        id="save-champ-category-btn"
                        class="btn btn-sm btn-success ark"
                        data-url="{% url "save-champ-category" %}"
                        data-target="champ-detail-content"
                        data-dismiss="modal"
                        data-champ_id="{{ champ.id }}"
                        data-champ_category_id="{{ champ_category.id }}">
                    {% trans "Guardar" %}
                </button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $('#save-champ-category-btn').on('click', function() {
        $(this).data('name', $('#champ-category-name').val());
    });
</script>
