<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 144" role="img" aria-labelledby="title">
  <title id="title">Activa tus 5 sentidos, y descubre una nueva forma de entender el baile.</title>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="29" fill="#fffaf0">
    <text x="244" y="34" text-anchor="end">activa tus</text>
    <text x="265" y="34" text-anchor="middle" fill="#fff06b" font-size="36">5</text>
    <text x="282" y="34">sentidos,</text>

    <text x="244" y="82" text-anchor="end">y</text>
    <text x="265" y="82" text-anchor="middle" fill="#fff06b" font-size="34">d</text>
    <text x="280" y="82" font-size="25">escubre una nueva forma,</text>

    <text x="244" y="130" text-anchor="end">de entender el</text>
    <text x="265" y="130" text-anchor="middle" fill="#fff06b" font-size="34">b</text>
    <text x="280" y="130">aile.</text>
  </g>
</svg>
