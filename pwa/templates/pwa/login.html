{% load i18n static %}

<!DOCTYPE html>
<html lang="en">
	<head>
		<title>{% block title %} {% trans "5db Dance School" %} {% endblock %}</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<link rel="manifest" href="{% static 'manifest.json' %}">

		<link rel="stylesheet" href="{% static "css/pwa.css" %}" />
		<script type="text/javascript" src="http://code.jquery.com/jquery.js"></script>

		<!-- Bootstrap -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" media="screen"/>
		<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

		<!-- JQuery -->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script> 

		{% block head_tag %} {% endblock %}
	</head>
	<body>

		 <div class="row justify-content-md-center">
			<div class="col-md-6 col-sm-12">
				<div class="card text-center">
					<div class="text-center">
						<img src="{% static "images/logo_5db.png" %}" class="card-img-top" alt="logo" style="width:50%">
					</div>
					<div class="card-header border-warning bg-warning">
						<h5 class="card-title">PIN</h5>
					</div>
					<div class="card-body">
						<form method="POST" action="{% url "pwa-set-pin" %}">
							{%csrf_token%}
							<input type="password" class="form-control" id="pin" name="pin" placeholder="">
							<br/>
							{%if err and err != ""%}<div class="alert alert-danger">{{err}}</div>{%endif%}
							<br/>
							<button class="btn btn-primary w-100 py-2" type="submit">Acceder</button>
						</form>
					</div>
				</div>
			</div>
		</div>


	</body>
</html>
